<!DOCTYPE html>
<html>
	<head>
		<title>petanque</title>
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">	
		<script src="js/signals.min.js"></script>
		<script src="js/snap.svg-min.js"></script>
		<style type="text/css">			
			html 
			{
				background-color:#D8D8D8; 
			}
			
			*
			{
				touch-action:none; 
			}

			*:not(input)
			{
				user-select:none;
			}
			
			#ui 
			{
				position:absolute;
				left:0;
				top:0;
				bottom:0;
				width:300px;
				background:white;
				outline:#CCC solid 1px;
				z-index:2;
				overflow:auto;
			}
			
			#ui span 
			{
				margin-right:10px;
			}
			
			#textTools, #commonTools
			{
				padding:10px;
			}
			
			#svgContainer
			{
				position:absolute;
				left:301px;
				right:0;
				top:0;
				bottom:0;
				outline:#CCC solid 1px;
				overflow:hidden;
				user-select:none;
			}
			
			#svgContainer svg
			{
				position:absolute;
				left:0;
				top:0;
				outline:#F00 solid 1px;
				user-select:none;
				pointer-events:none;
			}
			
			.hidden 
			{
				display:none;
			}

		</style>
	</head>
	<body>
		<div id="svgContainer">
		</div>
		<div id="ui">
			<div id="textTools" class="hidden">					
				<input type="text" id="textInput" />
				<button id="textRemoveButton">Delete</button><br />
				Text Length: <span id="textLength"></span><br />
				Max Chars <input type="number" id="textMaxChars" value="0" min="0" max="100" /><br />
				Font Size <input type="number" id="textFontSize" value="24" min="12" max="192" /><br />
				Font Family 
				<select id="textFontFamily">
					<option>Arial</option>
					<option>Times New Roman</option>
					<option>Courier New</option>
				</select><br />
				<hr />
				Fill 
				<select id="textFillType">
					<option data-type="solid"  data-controls="#textSolidFill">Solid</option>
					<option data-type="linear" data-controls="#textLinearFill">Linear Gradient</option>
					<option data-type="radial" data-controls="#textRadialFill">Radial Gradient</option>
				</select>
				<div id="textSolidFill" class="hidden">
					Color <input class="color1" type="color"></input>
				</div>
				<div id="textLinearFill" class="hidden">
					Color 1 <input class="color1" type="color"></input><br />
					Color 2 <input class="color2" type="color"></input><br />
					Rotation <input id="textLinearFillRotation" min="-180" max="180" value="0" type="range"></input>
				</div>
				<div id="textRadialFill" class="hidden">
					Color 1 <input class="color1" type="color"></input><br />
					Color 2 <input class="color2" type="color"></input>
				</div>
				<hr />
				Shadow <input id="textShadowEnabled" type="checkbox" /><br />
				<div id="textShadow">
					Color <input id="textShadowColor" type="color"></input><br />
					Blur <input id="textShadowBlur" min="0" max="16" value="0" type="range"></input><br />
					Rotation <input id="textShadowRotation" min="-180" max="180" step="15" value="0" type="range"></input><br />
					Distance <input id="textShadowDistance" min="0" max="32" value="0" type="range"></input><br />
					Opacity <input id="textShadowOpacity" min="0" max="1" step="0.01" value="1" type="range"></input><br />
				</div>
			</div>
			<div id="commonTools" class="hidden">
				<button id="textLineAddButton">Create Text Line</button><br /><br />
				<button id="textOnCircleAddButton">Create Text on Circle</button><br /><br />
			</div>
		</div>
		<script type="text/javascript">
			window.onload = () =>
			{
				console.clear(); 

				const Editor = ( { domContainer, width, height } ) =>
				{
					const HANDLE_SIZE = 24;
					const HANDLE_ROTATE_URL = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAA9klEQVRIie2TwXHDIBBFn9LAloA7oJSoA6sEuwJKwB2YEtSB3QGTClAHjCrYXMTBtuSAc0v8Zriwy/s7A8CbP09X0WOBA7C725+AE/D1mwAvIodhGOj7/qYwjiMhBOZ5PgHHikEf2BtjNOesW+Sc1RijwL5VbkREY4yb8kKMUUVEAdMScHbO/SgvOOcUOLcEpJRSdUBKSYG0Jtq6ZFXVloHoum7V99FkeYGtgGmapmrJ0rt6YCvgGkKoDlh6r9UHACsiT/9AIedcnqltCQDw1lp99ppSSmqtVcC3ygtORNR7/yD33pfJ3avywidwAfRuXZbam//ON2ozNbNkl43sAAAAAElFTkSuQmCC';
					
					const HANDLE_SCALE_URL = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAKElEQVRIiWNgGAWjYNADRgLy/yk1h4l4t5AHRi0YtWDUglEwCoYEAACykwEUk3EvFwAAAABJRU5ErkJggg==';
					
					const events =
					{
						elementAdded:new signals.Signal(),
						elementRemoved:new signals.Signal(),
						elementSelected:new signals.Signal(),
						elementDeselected:new signals.Signal(),
						elementScaleChanged:new signals.Signal(),
						elementAttributesChanged:new signals.Signal(),
						actionStarted:new signals.Signal(),
						actionFinished:new signals.Signal(),
					};
					
					// ----------------------------------------------------------------------
					
					const paper = Snap( width, height );
						  paper.clear();
						  paper.attr( { 'xmlns:xlink':'http://www.w3.org/1999/xlink' } );
						  					
					const root = paper.g().attr( { id:'root' } );
					const background = root.rect( 0, 0, width, height ).attr( { fill:'white' } );
					const editor = root.g().attr( { id:'editor' } );
					const objects = editor.g().attr( { id:'objects' } );
					const hoverBounds = editor.g().attr( { id:'hover-bounds' } );
					const selectedBounds = editor.g().attr( { id:'selected-bounds' } );
					const handles = editor.g().attr( { id:'handles' } );

					let hoverEnabled = true;					
					let hoverElement;				
					let selectedElement;
					
					let isPointerDown = false;
					let pointerX = 0;
					let pointerY = 0;
					let pointerDownX = 0;
					let pointerDownY = 0;

					let action,
						actionMatrix,
						actionElementStartX = 0,
						actionElementStartY = 0,
						actionPaperCenterX = 0,
						actionPaperCenterY = 0,
						actionStartAngle = 0,
						actionStartTextWidth = 0,
						actionStartDistance = 0,
						actionStartRadius = 0,
						actionStartArcLength = 0;

					let rotationHandle, widthHandle, widthHandle2, radiusHandle, arcLengthHandle;

					const updatePaperSize = () =>
					{
						const r = domContainer.getBoundingClientRect();
						const w = r.width;
						const h = r.height;
						const rx = ( w - width ) / 2;
						const ry = ( h - height ) / 2;
						
						paper.attr( { width:w, height:h } );

						root.transform
						( 
							new Snap.Matrix()
							// .scale( 0.75, 2, rx, ry ) // TEST
							// .rotate( 3, rx, ry ) // TEST
							.translate( rx, ry ) 
						);
					};
					
					const _lut = [];

					for( let i = 0; i < 256; i ++ ) 
						_lut[ i ] = ( i < 16 ? '0' : '' ) + ( i ).toString( 16 );

					const generateUUID = ( prefix ) =>
					{
						const d0 = Math.random() * 0xffffffff | 0;
						const d1 = Math.random() * 0xffffffff | 0;
						const d2 = Math.random() * 0xffffffff | 0;
						const d3 = Math.random() * 0xffffffff | 0;
						const uuid = prefix + '-' +
								_lut[ d0 & 0xff ] + _lut[ d0 >> 8 & 0xff ] + _lut[ d0 >> 16 & 0xff ] + _lut[ d0 >> 24 & 0xff ] + '-' +
								_lut[ d1 & 0xff ] + _lut[ d1 >> 8 & 0xff ] + '-' + _lut[ d1 >> 16 & 0x0f | 0x40 ] + _lut[ d1 >> 24 & 0xff ] + '-' +
								_lut[ d2 & 0x3f | 0x80 ] + _lut[ d2 >> 8 & 0xff ] + '-' + _lut[ d2 >> 16 & 0xff ] + _lut[ d2 >> 24 & 0xff ] +
								_lut[ d3 & 0xff ] + _lut[ d3 >> 8 & 0xff ] + _lut[ d3 >> 16 & 0xff ] + _lut[ d3 >> 24 & 0xff ];

						return uuid.toUpperCase();
					};
					
					const getElementByUUID = ( uuid ) => 
					{
						return objects.selectAll( 'g[class]' ).items.filter( element => {
							return element.data().uuid == uuid;
						} )[ 0 ];
					};
					
					// ----------------------------------------------------------------------
					
					const updateElementImage = ( element ) => 
					{
						if( element.data().bitmapCache == null ) 
							element.data().bitmapCache = document.createElement( 'canvas' );
							
						const bbox = element.getBBox( true );
						const canvas = element.data().bitmapCache;
						
						canvas.width = bbox.width;
						canvas.height = bbox.height;
						
						// BEGIN_TEMP
						/*if( canvas.parentElement == null ) 
							domContainer.appendChild( canvas );*/
						// END_TEMP 
						
						const context = canvas.getContext( '2d', { alpha:false, willReadFrequently:true } );
						
						context.clearRect( 0, 0, bbox.width, bbox.height );
						context.fillStyle = 'white';
						context.font = element.data().fontSize + 'px ' + '"' + element.data().fontFamily + '"';
							
						const type = element.data().type;
						const graphics = element.data().graphics;
						
						if( type == 'textOnCircle' )
						{
							graphics.selectAll( 'text' ).items.forEach( textElement => 
							{
								const matrix = textElement.transform().localMatrix;
								
								context.textAlign = 'left';
								context.textBaseline = 'alphabetic';
								context.transform( matrix.a, matrix.b, matrix.c, matrix.d, matrix.e - bbox.x, matrix.f - bbox.y );
								context.fillText( textElement.node.textContent, 0, 0 );
								context.resetTransform();
							} );
						}
						else if( type == 'textLine' )
						{
							const textElement = graphics.select( 'text' );
							const matrix = textElement.transform().localMatrix;
							
							context.textAlign = 'center';
							context.textBaseline = 'alphabetic';
							context.transform( matrix.a, matrix.b, matrix.c, matrix.d, matrix.e - bbox.x, matrix.f - bbox.y );						
							context.fillText( textElement.node.textContent, 0, 0 );
							context.resetTransform();
						}
					};
					
					const setFillAttributes = ( element, backgroundElement, attrs ) => 
					{
						if( element && attrs != null && ( attrs.hasOwnProperty( 'fillType' ) || attrs.hasOwnProperty( 'fillColors' ) ) )
						{
							console.log( 'setFillAttributes' );
							let fillType = element.data().fillType;
							
							if( attrs.hasOwnProperty( 'fillType' ) )
							{
								fillType = attrs.fillType;  // TODO: isValidFillType
								
								element.data().fillType = fillType;
							}
							
							if( attrs.hasOwnProperty( 'fillColors' ) )
							{
								if( fillType == 'solid' )
								{
									element.data().solidFillColor = Snap.getRGB( attrs.fillColors[ 0 ] ).hex;
								}
								else if( fillType == 'radial' || fillType == 'linear' )
								{
									const gradientElement = ( fillType == 'radial' ) ? element.data().radialGradient : element.data().linearGradient;
									
									gradientElement.selectAll( 'stop' ).items.forEach( ( stopElement, stopIndex ) => 
									{
										if( stopIndex < 2 )
											stopElement.attr( { stopColor:Snap.getRGB( attrs.fillColors[ stopIndex ] ).hex } );
									} );
								}
							}


							let fill = null;
							
							if( fillType == 'solid' )
								fill = element.data().solidFillColor;
							else if( fillType == 'linear' )
								fill = element.data().linearGradient;
							else if( fillType == 'radial' )
								fill = element.data().radialGradient;
							

							if( backgroundElement )
								backgroundElement.attr( { fill } );
						}
					};
					
					const setShadowAttributes = ( element, attrs ) => 
					{
						if( element && attrs != null && ( attrs.hasOwnProperty( 'shadowBlur' ) || attrs.hasOwnProperty( 'shadowColor' ) ||
							attrs.hasOwnProperty( 'shadowDistance' ) || attrs.hasOwnProperty( 'shadowRotation' ) || attrs.hasOwnProperty( 'shadowOpacity' )	) )
						{
							let shadow = element.data().shadow;
							let blur = element.data().shadowBlur;
							let color = element.data().shadowColor;
							let distance = element.data().shadowDistance;
							let rotation = element.data().shadowRotation;
							let opacity = element.data().shadowOpacity;
							
							if( attrs.hasOwnProperty( 'shadowBlur' ) )
							{
								blur = parseInt( attrs.shadowBlur );
								element.data().shadowBlur = blur;
							}
	
							if( attrs.hasOwnProperty( 'shadowColor' ) )
							{
								color = Snap.getRGB( attrs.shadowColor ).hex;
								element.data().shadowColor = color;
							}
							
							if( attrs.hasOwnProperty( 'shadowDistance' ) )
							{
								distance = parseFloat( attrs.shadowDistance );
								element.data().shadowDistance = distance;
							}
							
							if( attrs.hasOwnProperty( 'shadowRotation' ) )
							{
								rotation = parseInt( attrs.shadowRotation );
								element.data().shadowRotation = rotation;
							}
							
							if( attrs.hasOwnProperty( 'shadowOpacity' ) )
							{
								opacity = parseFloat( attrs.shadowOpacity );
								element.data().shadowOpacity = opacity;
							}
								
							const dx = Math.sin( rotation / 180 * Math.PI ) * distance;
							const dy = Math.cos( rotation / 180 * Math.PI ) * distance;
						
							shadow.select( 'feGaussianBlur' ).attr( { stdDeviation:blur } );
							shadow.select( 'feFlood' ).attr( { floodColor:color } );
							shadow.select( 'feOffset' ).attr( { dx, dy } );	
							shadow.select( 'feFuncA' ).attr( { slope:opacity } );
						}
					};
					
					const setLinearGradientAttributes = ( element, attrs ) =>
					{
						if( element && attrs != null && attrs.hasOwnProperty( 'fillRotation' ) )
						{
							const rotation = parseInt( attrs.fillRotation );
							const x = Math.sin( rotation / 180 * Math.PI );
							const y = Math.cos( rotation / 180 * Math.PI );
							const d = Math.sqrt( x * x + y * y ) * 0.5;
							const x1 = 0.5 + x * d;
							const y1 = 0.5 + y * d;
							const x2 = 0.5 - x * d;
							const y2 = 0.5 - y * d;
							
							element.data().fillRotation = rotation;
							element.data().linearGradient.attr( { x1, y1, x2, y2 } );
						}
					};
					
					const getElementAttributes = ( uuid ) => 
					{
						const attrs = {};
						const element = getElementByUUID( uuid );
						
						if( element )
						{
							attrs.uuid = uuid;
							attrs.type = element.data().type;

							if( attrs.type == 'textLine' || attrs.type == 'textOnCircle' )
							{								
								attrs.text = element.data().text;
								attrs.maxChars = element.data().maxChars;
								attrs.fontSize = element.data().fontSize;
								attrs.fontFamily = element.data().fontFamily;
								attrs.fillType = element.data().fillType;
								attrs.fillRotation = element.data().fillRotation;
								attrs.fillColors = [];
								
								if( attrs.fillType == 'solid' )
								{
									attrs.fillColors.push( Snap.getRGB( element.data().solidFillColor ).hex );
								}
								else if( attrs.fillType == 'radial' || attrs.fillType == 'linear' )
								{
									const gradientElement =  ( attrs.fillType == 'radial' ) ? element.data().radialGradient : element.data().linearGradient;

									gradientElement.selectAll( 'stop' ).items.forEach( stopElement => 
									{
										attrs.fillColors.push( Snap.getRGB( stopElement.attr( 'stopColor' ) ).hex );
									} );
								}
								
								attrs.shadowEnabled = element.data().shadowEnabled;
								attrs.shadowBlur = element.data().shadowBlur;
								attrs.shadowDistance = element.data().shadowDistance;
								attrs.shadowRotation = element.data().shadowRotation;
								attrs.shadowColor = Snap.getRGB( element.data().shadowColor).hex;
								attrs.shadowOpacity = element.data().shadowOpacity;
							}
							
							if( attrs.type == 'textLine' )
							{
								attrs.textWidth = element.data().textWidth;
							}
							
							if( attrs.type == 'textOnCircle' )
							{
								attrs.radius = element.data().radius;
								attrs.arcLength = element.data().arcLength;
							}
						}
					
						return attrs;
					};
					
					const setAttributes = ( element, attrs ) => 
					{
						const type = element.data().type;
							
						// console.log( 'setElementAttributes:', type, attributes );
						
						let backgroundElement = null;
						
						// ----------------------------------------------------------------------
						if( type == 'textOnCircle' )
						{
							const pathElement = element.selectAll( 'path' ).items[ 0 ]; // [class=path]
							
							backgroundElement = element.selectAll( 'circle' ).items[ 0 ];
							
							let needsUpdate = false;
							let radius = element.data().radius;
							let arcLength = element.data().arcLength;
							let text = element.data().text;
							let maxChars = element.data().maxChars;
							let fontSize = element.data().fontSize;
							let fontFamily = element.data().fontFamily;
							
							if( attrs != null && ( attrs.hasOwnProperty( 'radius' ) || attrs.hasOwnProperty( 'arcLength' ) || attrs.hasOwnProperty( 'text' ) ||
								attrs.hasOwnProperty( 'maxChars' ) || attrs.hasOwnProperty( 'fontSize' ) || attrs.hasOwnProperty( 'fontFamily' ) ) )
							{	
								console.log( 'setTextOnCircleAttributes' );
								
								if( attrs.hasOwnProperty( 'radius' ) )
								{
									radius = Math.max( 30, Math.min( 450, attrs.radius ) );
									element.data().radius = radius;
									needsUpdate = true;
								}
								
								if( attrs.hasOwnProperty( 'arcLength' ) )
								{
									arcLength = Math.max( 90, Math.min( 350, attrs.arcLength ) );
									element.data().arcLength = arcLength;
									needsUpdate = true;
								}
								
								if( attrs.hasOwnProperty( 'text' ) )
								{							
									text = attrs.text;
									element.data().text = text;
									needsUpdate = true;
								}
								
								if( attrs.hasOwnProperty( 'maxChars' ) )
								{
									maxChars = Math.max( 0, Math.min( 100, attrs.maxChars ) );
									element.data().maxChars = maxChars;
									needsUpdate = true;
								}
								
								if( attrs.hasOwnProperty( 'fontSize' ) )
								{
									fontSize = Math.max( 12, Math.min( 192, attrs.fontSize ) );
									element.data().fontSize = fontSize;
									needsUpdate = true;
								}
								
								if( attrs.hasOwnProperty( 'fontFamily' ) )
								{
									fontFamily = attrs.fontFamily;
									element.data().fontFamily = fontFamily;
									needsUpdate = true;
								}							 

								if( maxChars > 0 && text.length > maxChars )
								{
									text = text.substr( 0, maxChars );
									needsUpdate = true;
								}
								
								if( needsUpdate )
								{
							
									element.data().mask.clear();
									element.data().graphics.clear();
										
									const textAttrs = 
									{
										textAnchor:'left',
										fontSize:element.data().fontSize,
										fontFamily:'"' + element.data().fontFamily + '"',
										fill:'white',						
									};
									
								
									let textElement = element.text( 0, 0, 'M' ).attr( textAttrs );
										textElement.node.setAttributeNS( 'http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve' );
										
									const charBBox = textElement.getBBox( true );
									
									if( radius - charBBox.height < 0 )
										radius = charBBox.height;
										
									const pathRadius = radius - charBBox.height + charBBox.y2;
									const pathStartAngle = ( 90 + ( 360 - arcLength ) / 2 ) * Math.PI / 180;
									const pathArcLength = arcLength * Math.PI / 180;
									
									
										
									backgroundElement.attr( { r:radius } );
							
									element.data().path = getEllipticalArcPath( 0, 0, pathRadius, pathRadius, pathStartAngle, pathArcLength, 0 );
									pathElement.attr( { d:element.data().path, stroke:( element == selectedElement ) ? 'black' : 'none' } );						
									
									textElement.attr( { text } );

									const pathLength = pathElement.getTotalLength();
									
									let charScale = 1.0;
									let textLength = textElement.node.getComputedTextLength();
									
									textElement.attr( { text:text.replace( /\s/g, '' ) } );

									const textLengthWithoutSpaces = textElement.node.getComputedTextLength();
									const spacesNum = ( text.match( /\s/g ) || [] ).length;
									const spaceWidth = ( textLength - textLengthWithoutSpaces ) / spacesNum;

									if( textLength > pathLength )
									{
										charScale = pathLength / textLength;
										textLength = pathLength - 1;
									}
									
									textElement.remove();
									textElement = null;
									
									let isSpaceChar;
									let pathPosition = ( pathLength - textLength ) / 2;
									
									text.split( '' ).forEach( char => 
									{
										const charElement = element.text( 0, 0, char ).attr( textAttrs );
										const charBBox = charElement.getBBox( true );
										
										isSpaceChar = Array.isArray( char.match( /\s/g ) );
										
										if( isSpaceChar )
										{
											charBBox.w = spaceWidth;
											charBBox.cx = spaceWidth / 2;
										}
									
										const matrix = new Snap.Matrix();
										const position = Math.max( 0, pathPosition + charBBox.x * charScale );
										const pathPoint = pathElement.getPointAtLength( position );
										const pathPoint2 = pathElement.getPointAtLength( pathPosition + charBBox.cx * charScale );
										
										pathPosition += charBBox.w * charScale + charBBox.x * charScale;
										
										matrix.translate( pathPoint.x, pathPoint.y );
										matrix.rotate( pathPoint2.alpha + 180 ).scale( charScale, 1 );
										
										charElement.transform( matrix );
										element.data().mask.append( charElement );
										
										if( !isSpaceChar )
										{
											const charElement2 = element.text( 0, 0, char )
												.attr( textAttrs )
												.transform( matrix );
											
											element.data().graphics.append( charElement2 );
										}
									} );

									const pathStart = pathElement.getPointAtLength( 0 );
									const pathEnd = pathElement.getPointAtLength( pathElement.getTotalLength() );
									
									element.data().pathStartX = pathStart.x;
									element.data().pathStartY = pathStart.y;
									element.data().pathEndX = pathEnd.x;
									element.data().pathEndY = pathEnd.y;
									
									updateElementImage( element );
								}
							}
							else 
							{
								pathElement.attr( { d:element.data().path, stroke:( element == selectedElement ) ? 'black' : 'none' } );
							}
						}
						else if( type == 'textLine' )
						{
							backgroundElement = element.selectAll( 'rect' ).items[ 0 ];
							
							let needsUpdate = false;
							let text = element.data().text;
							let maxChars = element.data().maxChars;
							let textWidth = element.data().textWidth;
							let fontSize = element.data().fontSize;
							let fontFamily = element.data().fontFamily;
							
							if( attrs != null&& ( attrs.hasOwnProperty( 'text' ) || attrs.hasOwnProperty( 'textWidth' ) || attrs.hasOwnProperty( 'maxChars' ) ||

						const fs = ( arcLength > 0 ) ? 1 : 0;

							const elementPointer = globalToLocal( selectedElement, pointerX, pointerY );
							const endAngle = Math.abs( Math.atan2( elementPointer.x, elementPointer.y ) / Math.PI * 180 ); 
							const arcLength = actionStartArcLength - ( endAngle - actionStartAngle ) * 2;
							
							//console.log( actionStartAngle, endAngle );
							
							setAttributes( selectedElement, { arcLength } );
						}
						
						if( action == 'changeWidth' || action == 'changeWidth2' )
						{
							const elementEndX = globalToLocal( selectedElement, pointerX, pointerY ).x;
							const diff = ( action == 'changeWidth' ) ? ( elementEndX - actionElementStartX ) : -( elementEndX - actionElementStartX ); // 
							const textWidth = actionStartTextWidth + diff * 2;
							
							setAttributes( selectedElement, { textWidth } );

							
							// events.elementAttributesChanged.dispatch( selectedElement.data().uuid );
						}
						
						if( action == 'changeRadius' )
						{
							const elementPointer = globalToLocal( selectedElement, pointerX, pointerY );
							const endDistance = getDistance( 0, 0, elementPointer.x, elementPointer.y );
							const radius = actionStartRadius + ( endDistance - actionStartDistance );
							
							setAttributes( selectedElement, { radius } );
							
							// console.log( selectedElement.data().pathStartX, selectedElement.data().pathStartY );
						}
					};
					
					
					
					
					// ----------------------------------------------------------------------

					domContainer.appendChild( paper.node );
					
					window.addEventListener( 'resize', event => updatePaperSize() );
					window.addEventListener( 'blur', event => 
					{
						setPointerDown( false );
					} );
					
					window.addEventListener( 'pointermove', event => 
					{
						const rect = paper.node.getBoundingClientRect();	
						setPointer( event.clientX - rect.left, event.clientY - rect.top );						
					} );
					
					document.addEventListener( 'pointerdown', event => 
					{
						if( event.target.closest( '#svgContainer' ) )
						{
							const rect = paper.node.getBoundingClientRect();
							setPointer( event.clientX - rect.left, event.clientY - rect.top );	
							setPointerDown( true );
						}
					} );
					
					window.addEventListener( 'pointerup', event => 
					{
						const rect = paper.node.getBoundingClientRect();
						setPointer( event.clientX - rect.left, event.clientY - rect.top );	
						setPointerDown( false );
					} );					
					
					updatePaperSize();

					return {
						events,
						
						width:() => width,
						height:() => height,
						
						addTextLine,
						addTextOnCircle,
						
						getElementAttributes,
						setElementAttributes,
						removeElement,
					};
				};
				
				const UI = ( { domContainer, editor } ) =>  
				{
					const events =
					{
						addTextLineRequested:new signals.Signal(),
						addTextOnCircleRequested:new signals.Signal(),
					};
					
					// ----------------------------------------------------------------------
					
					const commonTools = document.querySelector( '#commonTools' );
					const textLineAddButton = document.querySelector( '#textLineAddButton' );
					const textOnCircleAddButton = document.querySelector( '#textOnCircleAddButton' );
					
					commonTools.classList.remove( 'hidden' );

					textLineAddButton.onclick = () => events.addTextLineRequested.dispatch();
					textOnCircleAddButton.onclick = () => events.addTextOnCircleRequested.dispatch();
					
					// ----------------------------------------------------------------------
					// Текст
					// ----------------------------------------------------------------------
					
					const textTools = document.querySelector( '#textTools' );
						const textRemoveButton = document.querySelector( '#textRemoveButton' );
						const textInput = document.querySelector( '#textInput' );
						const textLength = document.querySelector( '#textLength' );
						const textMaxChars = document.querySelector( '#textMaxChars' );
						const textFontSize = document.querySelector( '#textFontSize' );
						const textFontFamily = document.querySelector( '#textFontFamily' );
						const textFillType = document.querySelector( '#textFillType' );
						const textSolidFill = document.querySelector( '#textSolidFill' );
							const textSolidFillColor = textSolidFill.querySelector( '.color1' );
						const textLinearFill = document.querySelector( '#textLinearFill' );
							const textLinearFillColor1 = textLinearFill.querySelector( '.color1' );
							const textLinearFillColor2 = textLinearFill.querySelector( '.color2' );
							const textLinearFillRotation = document.querySelector( '#textLinearFillRotation' );
						const textRadialFill = document.querySelector( '#textRadialFill' );
							const textRadialFillColor1 = textRadialFill.querySelector( '.color1' );
							const textRadialFillColor2 = textRadialFill.querySelector( '.color2' );
						
						const textShadowEnabled = document.querySelector( '#textShadowEnabled' );
						const textShadow = document.querySelector( '#textShadow' );
							const textShadowColor = document.querySelector( '#textShadowColor' );
							const textShadowBlur = document.querySelector( '#textShadowBlur' );
							const textShadowRotation = document.querySelector( '#textShadowRotation' );
							const textShadowDistance = document.querySelector( '#textShadowDistance' );
							const textShadowOpacity = document.querySelector( '#textShadowOpacity' );

					
					const onElementAttributesChanged = ( uuid ) => 
					{
						// TODO: проверить наш ли это uuid
						const attrs = editor.getElementAttributes( uuid );
						
						// console.log( attrs );
						
						textInput.value = attrs.text;
						textLength.textContent = attrs.text.length;
						textMaxChars.value = attrs.maxChars;
						textFontSize.value = attrs.fontSize;
						
						for( let i = 0; i < textFontFamily.options.length; i++ )
						{
							if( textFontFamily.options[ i ].textContent == attrs.fontFamily )
							{
								textFontFamily.selectedIndex = i;
								break;
							}
						}
						
						let fillControls;
						
						for( let i = 0; i < textFillType.options.length; i++ )
						{
							const option = textFillType.options[ i ];
							
							if( option.dataset.type == attrs.fillType )
							{
								fillControls = document.querySelector( option.dataset.controls );
								fillControls.classList.remove( 'hidden' );
								
								textFillType.selectedIndex = i;
							}
							else 
							{
								document.querySelector( option.dataset.controls ).classList.add( 'hidden' );
							}
						}
						
						if( fillControls )
						{
							const color1Input = fillControls.querySelector( '.color1' );
							const color2Input = fillControls.querySelector( '.color2' );
							
							if( color1Input )
								color1Input.value = attrs.fillColors[ 0 ];
								
							if( color2Input )
								color2Input.value = attrs.fillColors[ 1 ];
								
							if( textLinearFillRotation.parentElement == fillControls )
							{
								textLinearFillRotation.value = attrs.fillRotation;
							}							
						}
						
						textShadowEnabled.checked = attrs.shadowEnabled;
						
						if( attrs.shadowEnabled ) textShadow.classList.remove( 'hidden' );
						else textShadow.classList.add( 'hidden' );

						textShadowColor.value = attrs.shadowColor;
						textShadowBlur.value = attrs.shadowBlur;
						textShadowRotation.value = attrs.shadowRotation;
						textShadowDistance.value = attrs.shadowDistance;
						textShadowOpacity.value = attrs.shadowOpacity;
					};

					editor.events.elementSelected.add( uuid => 
					{ 
						commonTools.classList.add( 'hidden' );
						
						textTools.classList.remove( 'hidden' );
						
						textRemoveButton.onclick = () => editor.removeElement( uuid );
						textInput.oninput = textInput.onchange = () => editor.setElementAttributes( uuid, { text:textInput.value } );

						textMaxChars.onchange = () => 
						{
							const min = textMaxChars.min;
							const max = textMaxChars.max;
							const maxChars = Math.max( Math.min( textMaxChars.value, max ), min );
							
							editor.setElementAttributes( uuid, { maxChars } );
						};

						textFontSize.onchange = () => 
						{	
							const min = textFontSize.min;
							const max = textFontSize.max;
							const fontSize = Math.max( Math.min( textFontSize.value, max ), min );
							
							editor.setElementAttributes( uuid, { fontSize } ); 
						};
						
						textFontFamily.onchange = () => editor.setElementAttributes( uuid, { fontFamily:textFontFamily.options[ textFontFamily.selectedIndex ].textContent } );
						textFillType.onchange = () => editor.setElementAttributes( uuid, { fillType:textFillType.options[ textFillType.selectedIndex ].dataset.type } );
						
						textSolidFillColor.oninput = 
						textSolidFillColor.onchange = () => editor.setElementAttributes( uuid, { fillColors:[ textSolidFillColor.value ] } );
						textLinearFillColor1.oninput = 
						textLinearFillColor1.onchange = 
						textLinearFillColor2.oninput = 
						textLinearFillColor2.onchange = () => editor.setElementAttributes( uuid, { fillColors:[ textLinearFillColor1.value, textLinearFillColor2.value ] } );
						textLinearFillRotation.oninput =
						textLinearFillRotation.onchange = () => editor.setElementAttributes( uuid, { fillRotation:[ textLinearFillRotation.value ] } );
						textRadialFillColor1.oninput =
						textRadialFillColor1.onchange = 
						textRadialFillColor2.oninput =
						textRadialFillColor2.onchange = () => editor.setElementAttributes( uuid, { fillColors:[ textRadialFillColor1.value, textRadialFillColor2.value ] } );
						
						textShadowEnabled.onchange = () => editor.setElementAttributes( uuid, { shadowEnabled:textShadowEnabled.checked } );
						textShadowColor.oninput =
						textShadowColor.onchange = () => editor.setElementAttributes( uuid, { shadowColor:textShadowColor.value } );
						textShadowBlur.oninput =
						textShadowBlur.onchange = () => editor.setElementAttributes( uuid, { shadowBlur:textShadowBlur.value } );
						textShadowRotation.oninput =
						textShadowRotation.onchange = () => editor.setElementAttributes( uuid, { shadowRotation:textShadowRotation.value } );
						textShadowDistance.oninput =
						textShadowDistance.onchange = () => editor.setElementAttributes( uuid, { shadowDistance:textShadowDistance.value } );
						textShadowOpacity.oninput =
						textShadowOpacity.onchange = () => editor.setElementAttributes( uuid, { shadowOpacity:textShadowOpacity.value } );
						
						onElementAttributesChanged( uuid );
						
						editor.events.elementAttributesChanged.add( onElementAttributesChanged );
					} );
					
					editor.events.elementDeselected.add( uuid => 
					{ 
						commonTools.classList.remove( 'hidden' );
						
						textTools.classList.add( 'hidden' );
						
						textRemoveButton.onclick = 
						textInput.oninput = textInput.onchange = 
						textMaxChars.onchange = 
						textFontSize.onchange = 
						textFontFamily.onchange = 
						textFillType.onchange = 
						textSolidFillColor.onchange = 
						textLinearFillColor1.onchange = 
						textLinearFillColor2.onchange = 
						textRadialFillColor1.onchange = 
						textRadialFillColor2.onchange = 
						textSolidFillColor.oninput = 
						textLinearFillColor1.oninput = 
						textLinearFillColor2.oninput = 
						textLinearFillRotation.oninput =
						textLinearFillRotation.onchange =
						textRadialFillColor1.oninput = 
						textRadialFillColor2.oninput = 
						textShadowColor.oninput = 
						textShadowColor.onchange =
						textShadowBlur.oninput =
						textShadowBlur.onchange =
						textShadowRotation.oninput =
						textShadowRotation.onchange =
						textShadowDistance.oninput =
						textShadowDistance.onchange =
						textShadowOpacity.oninput =
						textShadowOpacity.onchange = null;
						
						editor.events.elementAttributesChanged.remove( onElementAttributesChanged );
					} );
					
					return {
						events,
					};
					
					// ----------------------------------------------------------------------
				};
				
				const editor = Editor( { domContainer:document.querySelector( '#svgContainer' ), width:800, height:600 } );
				const ui = UI( { domContainer:document.querySelector( '#ui' ), editor } );
				
				ui.events.addTextLineRequested.add( () => editor.addTextLine( 'texte', editor.width() / 2, editor.height() / 2 ) );
				ui.events.addTextOnCircleRequested.add( () => editor.addTextOnCircle( 'ABCDEFGHIJKLMNOPQRSTUVWXYZ123456', editor.width() / 2, editor.height() / 2, 150 ) ); // tÄjMe
				
				// console.log( editor.width(), editor.height() );
				
			};
		</script>
	</body>
</html>
